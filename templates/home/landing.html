<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyecto KK</title>
</head>

<body>

    <h1>
        Bienvenido, {{ request.user.username }}
    </h1>

    <p>
        Has iniciado sesión correctamente.
    </p>

    <p>
        Correo: {{ request.user.email }}
    </p>
    
    <p>
        <a href="{% url 'perfil' %}">

        </a>
    </p>

    <p>
        <a href="{% url 'registrar_cagada' %}">

        </a>

    <p>
        <a href="{% url 'listar_ubicaciones' %}">

        </a>
    </p>
    
    <p>
        <a href="{% url 'historial_cagadas' %}">

        </a>
    </p>

            Ver feed de cagadas
        </a>
    </p>

    <p>
        <a href="{% url 'analytics' %}">
        Analítica
        </a>
    </p>
    
    <form method="POST" action="{% url 'logout' %}">

    {% csrf_token %}

    <button type="submit">
        Cerrar sesión
    </button>

    </form>
