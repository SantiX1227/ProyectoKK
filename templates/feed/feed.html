<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Feed - Proyecto KK</title>

</head>

<body>

    <h1>
        Feed de cagadas
    </h1>


    <p>
        Aquí aparecen las cagadas que los usuarios
        han decidido compartir.
    </p>


    <hr>


    {% if cagadas %}

        {% for cagada in cagadas %}

            {% include "feed/components/publicacion.html" %}

        {% endfor %}

    {% else %}

        <p>
            Todavía no hay cagadas públicas.
        </p>

    {% endif %}


    <hr>


    <nav>

        <p>
            <a href="{% url 'registrar_cagada' %}">
                Registrar cagada
            </a>
        </p>

        <p>
            <a href="{% url 'historial_cagadas' %}">
                Mi historial
            </a>
        </p>

        <p>
            <a href="{% url 'home' %}">
                Volver al inicio
            </a>
        </p>

    </nav>

</body>

</html>
