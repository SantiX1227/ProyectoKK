{% extends 'base.html' %}

{% block title %}Eliminar ubicación - Proyecto KK{% endblock %}

{% block content %}
<main class="confirm-page">
    <div class="confirm-card">

        <span class="confirm-icon">📍</span>

        <h1>¿Eliminar esta ubicación?</h1>
        <p>Las cagadas asociadas no se eliminan: quedarán sin ubicación.</p>

        <div class="info-list">
            <div class="info-item">
                <span class="info-label">Nombre</span>
                <span class="info-value">{{ ubicacion.nombre }}</span>
            </div>

            <div class="info-item">
                <span class="info-label">Tipo</span>
                <span class="info-value">{{ ubicacion.tipo }}</span>
            </div>
        </div>

        <div class="confirm-actions">
            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger btn-lg">
                    Sí, eliminar ubicación
                </button>
            </form>

            <a href="{% url 'listar_ubicaciones' %}" class="btn btn-ghost">
                Cancelar
            </a>
        </div>

    </div>
</main>
{% endblock %}
