{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar ubicación - Proyecto KK</title>
</head>

<body>

    <h1>Editar ubicación</h1>

    <p>
        Editando:
        <strong>{{ ubicacion.nombre }}</strong>
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {{ form.as_p }}

        <p>
            <button
                type="button"
                id="btn-geolocalizar"
                data-automatica="false"
            >
                📍 Usar mi ubicación actual
            </button>
        </p>

        <p id="estado-geolocalizacion" aria-live="polite"></p>

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <p>
        <a href="{% url 'listar_ubicaciones' %}">
            Cancelar
        </a>
    </p>

    <script src="{% static 'js/ubicaciones.js' %}"></script>

</body>

</html>
