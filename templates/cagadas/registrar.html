<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar cagada - Proyecto KK</title>
</head>
<body>
    <h1>Registrar cagada</h1>

    <form method="POST">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div style="color: red;">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        {{ form.as_p }}

        <p>
            <a href="{% url 'listar_ubicaciones' %}">Ver mis ubicaciones</a>
            |
            <button
                type="submit"
                formaction="{% url 'crear_ubicacion' %}"
                formnovalidate
                name="origen"
                value="registrar_cagada"
            >
                Añadir nueva ubicación
            </button>
        </p>

        <button type="submit">Registrar cagada</button>
    </form>

    <p>
        <a href="{% url 'home' %}">Cancelar</a>
    </p>
</body>
</html>
