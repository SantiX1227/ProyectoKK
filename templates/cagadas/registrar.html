{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar cagada - Proyecto KK</title>
</head>
<body>
    <h1>Registrar cagada</h1>

    <form method="POST">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div style="color: red;">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        {{ form.as_p }}

        <hr>

        <h2>Temporizador</h2>

        <p>Estado: <strong id="estado">Sin iniciar</strong></p>
        <p>Inicio: <span id="hora-inicio">—</span></p>
        <p>Tiempo: <strong id="temporizador">00:00:00</strong></p>
        <p>Final: <span id="hora-final">—</span></p>

        <button type="button" id="btn-iniciar">▶ Iniciar cagada</button>
        <button type="button" id="btn-terminar" disabled>■ Terminar cagada</button>

        <hr>

        <p>
            <a href="{% url 'listar_ubicaciones' %}">Ver mis ubicaciones</a>
            |
            <button
                type="submit"
                formaction="{% url 'crear_ubicacion' %}"
                formnovalidate
                name="origen"
                value="registrar_cagada"
            >
                Añadir nueva ubicación
            </button>
        </p>

        <button type="submit" id="btn-registrar" disabled>
            Registrar cagada
        </button>
    </form>

    <p>
        <a href="{% url 'home' %}">Volver al inicio</a>
    </p>

    <script src="{% static 'js/cagadas.js' %}"></script>
</body>
</html>
