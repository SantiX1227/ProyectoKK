<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Proyecto KK</title>
</head>
<body>
    <h1>Proyecto KK</h1>
    <h2>Recuperar contraseña</h2>

    <p>Introduce el correo electrónico asociado a tu cuenta.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar enlace</button>
    </form>

    <p>
        <a href="{% url 'login' %}">Volver al inicio de sesión</a>
    </p>
</body>
</html>
