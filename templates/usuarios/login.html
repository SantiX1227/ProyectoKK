<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Proyecto KK</title>
</head>
<body>
    <h1>Proyecto KK</h1>
    <h2>Iniciar sesión</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div>
            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
            >
        </div>

        <br>

        <div>
            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >
        </div>

        <br>

        <button type="submit">Iniciar sesión</button>
    </form>

    <p>
        ¿No tienes una cuenta?
        <a href="{% url 'registro' %}">Crear una cuenta</a>
    </p>

    <p>
        <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
    </p>
</body>
</html>
