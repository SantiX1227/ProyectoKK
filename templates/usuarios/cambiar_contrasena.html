{% extends "base.html" %}
{% load static %}

{% block title %}Cambiar contraseña - Proyecto KK{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<main class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Cambiar contraseña</h1>
            <p>Ingresa tu contraseña actual y la nueva</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="django-as-p">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
                Cambiar contraseña
            </button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'perfil' %}">
                Cancelar
            </a>
        </div>
    </div>
</main>
{% endblock %}
