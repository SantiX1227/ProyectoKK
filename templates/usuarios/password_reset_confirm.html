<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - Proyecto KK</title>
</head>
<body>
    <h1>Proyecto KK</h1>
    <h2>Crear nueva contraseña</h2>

    {% if validlink %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Cambiar contraseña</button>
        </form>
    {% else %}
        <p>Este enlace no es válido o ya fue utilizado.</p>
        <p>
            <a href="{% url 'password_reset' %}">Solicitar un nuevo enlace</a>
        </p>
    {% endif %}
</body>
</html>
